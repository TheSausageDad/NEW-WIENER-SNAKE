<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>NEW-WIENER-SNAKE</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

      @font-face {
        font-family: 'TF Funky Fusion Demo';
        src: url('/fonts/FunkyFusion.ttf?v=2') format('truetype');
        font-display: block;
      }

      @font-face {
        font-family: 'Baristo';
        src: url('/fonts/Baristo.ttf') format('truetype');
        font-display: block;
      }

      * {
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }

      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #754938;
        font-family: 'Press Start 2P', monospace;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
      }

      #game-container {
        box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
        outline: 24px solid #dd5342;
        outline-offset: 0;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        width: 100%;
        height: 100%;
        max-width: 640px;
        max-height: 800px;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      #game-container canvas {
        display: block;
        width: 100% !important;
        height: 100% !important;
        object-fit: contain;
      }

      @media (max-width: 768px), (max-height: 820px) {
        #game-container {
          outline-width: 12px;
          max-width: 100vw;
          max-height: 100vh;
          max-height: 100dvh; /* Dynamic viewport height for mobile */
        }
      }

      @media (orientation: landscape) and (max-height: 600px) {
        #game-container {
          max-height: 95vh;
          max-height: 95dvh;
        }
      }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
