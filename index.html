<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <script src="https://unpkg.com/@farcade/game-sdk@latest/dist/index.min.js" async></script>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>NEW-WIENER-SNAKE</title>
    <style>
      * {
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }

      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #754938;
        font-family: Arial, sans-serif;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
      }

      #game-container {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        position: relative;
      }

      #game-container canvas {
        display: block;
      }

      @media (max-width: 768px), (max-height: 820px) {
        body {
          padding: 0;
          margin: 0;
          background: #754938; /* Match game background */
        }

        #game-container {
          max-width: 100vw;
          max-height: 100vh;
          max-height: 100dvh; /* Dynamic viewport height for mobile */
          width: 100vw;
          height: 100vh;
          height: 100dvh;
          border: none; /* No border on mobile */
          box-sizing: border-box;
        }

        #game-container canvas {
          border-width: 0px; /* No red border on mobile */
          max-width: 100% !important;
          max-height: 100% !important;
        }
      }

      @media (orientation: landscape) and (max-height: 600px) {
        #game-container {
          max-height: 100vh;
          max-height: 100dvh;
          height: 100vh;
          height: 100dvh;
        }
      }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
